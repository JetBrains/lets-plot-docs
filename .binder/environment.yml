name: lets-plot-docs
channels:
  - conda-forge
  - jetbrains
dependencies:
  - python=3.10
  - bs4
  - cairosvg
  - cartopy
  - gdal=3.5.0
  - geopandas
  - jupyter
  - jupyter_sphinx
  - kotlin-jupyter-kernel
  - numpy
  - numpydoc
  - pandas
  - pip
  - polars
  - pyarrow
  - pydata-sphinx-theme=0.15.2
